
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>JARVIS GEO-APP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>


<div class="screen active" id="splash">
  <div class="splash-wrap">
    <svg class="griffin" viewBox="0 0 120 120">
      <defs><linearGradient id="g" x1="0" y1="0" x2="120" y2="120"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#2563eb"/></linearGradient></defs>
      <path d="M60 8C60 8,20 20,20 55C20 85,60 112,60 112C60 112,100 85,100 55C100 20,60 8,60 8Z" fill="url(#g)" opacity="0.12"/>
      <path d="M60 8C60 8,20 20,20 55C20 85,60 112,60 112C60 112,100 85,100 55C100 20,60 8,60 8Z" stroke="url(#g)" stroke-width="1.2" fill="none"/>
      <path d="M48 42C48 38,52 34,58 34C62 34,66 36,68 40L72 38L70 44C72 46,73 49,72 52L74 54L70 56C70 60,66 64,60 66L60 72L56 70L56 76L52 74L52 80L48 78L48 84C48 84,44 82,44 76L44 68C40 66,38 62,38 58C38 52,42 46,48 42Z" fill="url(#g)" opacity="0.85"/>
      <circle cx="62" cy="38" r="5" fill="url(#g)"/>
      <path d="M56 30L58 24L60 28L62 24L64 28L66 24L68 30Z" fill="#fbbf24" opacity="0.7"/>
    </svg>
    <h1>Путешествуй по Беларуси</h1>
    <p>Достопримечательности, маршруты и погода</p>
    <button class="btn-main" onclick="go('regions')">Начать путешествие</button>
  </div>
</div>


<div class="screen" id="regions">
  <div class="topbar"><h2>Выберите регион</h2><span class="step">1/4</span></div>
  <input class="search" placeholder="Поиск региона..." oninput="filterRegions(this.value)">
  <div class="grid" id="regions-grid"></div>
</div>


<div class="screen" id="cities">
  <button class="back" onclick="go('regions')">← Назад</button>
  <div class="topbar"><h2 id="region-title">Область</h2><span class="step">2/4</span></div>
  <input class="search" placeholder="Поиск города..." oninput="filterCities(this.value)">
  <div class="grid" id="cities-grid"></div>
</div>


<div class="screen" id="weather">
  <div class="topbar">
    <h2>Погода</h2>
  </div>

  <div id="weather-empty" class="weather-empty">
    <div class="weather-empty-icon">☀️</div>
    <h3>Погода по городу</h3>
    <p>
      Сначала выберите город в разделе
      «Путешествия»
    </p>

    <button
      class="btn-main weather-go-btn"
      onclick="go('regions')"
    >
      Выбрать город
    </button>
  </div>

  <div id="weather-box" style="display:none"></div>
</div>


<div class="screen" id="tags">
  <button class="back" onclick="go('cities')">← Назад</button>
  <div class="topbar"><h2>Интересы</h2><span class="step">3/4</span></div>
  <p class="hint">Можно выбрать несколько категорий</p>
  <div class="tags" id="tags-list"></div>
  <button class="btn-main" id="btn-tags" onclick="loadCards()" disabled>Показать места</button>
</div>


<div class="screen" id="cards">
  <button class="back" onclick="go('tags')">← Назад</button>
  <div class="topbar"><h2 id="cards-title">Места</h2></div>
  <div class="feed" id="feed"></div>
</div>


<div class="screen" id="route">
  <button class="back" onclick="goBackFromRoute()">← Назад</button>
  <div class="topbar"><h2>Мой маршрут</h2></div>
  <div id="route-list"></div>
  <button class="btn-route" id="btn-build" onclick="buildRoute()" disabled>Построить маршрут</button>
</div>


<button class="fab hidden" id="fab" onclick="go('route')">🗺 Маршрут <span id="fab-count">0</span></button>


<nav class="bottom-nav" id="bottom-nav">

  <button
    class="bottom-nav-item active"
    data-tab="travel"
    onclick="bottomNavigate('travel')"
  >
    <span class="bottom-nav-icon">🧭</span>
    <span class="bottom-nav-label">Путешествия</span>
  </button>

  <button
    class="bottom-nav-item"
    data-tab="weather"
    onclick="bottomNavigate('weather')"
  >
    <span class="bottom-nav-icon">☀️</span>
    <span class="bottom-nav-label">Погода</span>
  </button>

</nav>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
