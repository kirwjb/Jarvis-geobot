<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0c0e">
<title>JARVIS GEO-APP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/style.css?v=20260906-7">
<link rel="stylesheet" href="/css/components.css?v=20260906-4">
<link rel="stylesheet" href="/css/interactions.css?v=20260906-2">
<link rel="stylesheet" href="/css/weather.css?v=20260906-1">
<link rel="icon" type="image/svg+xml" href="/logo.svg?v=2">
</head>
<body>
<header class="top-controls" id="top-controls">
  <button class="top-control theme-control" id="theme-toggle" type="button" data-action="theme" aria-label="Тема"><span id="theme-icon">☀</span></button>
  <button class="top-control language-control" id="language-toggle" type="button" data-action="language" aria-label="Язык"><span id="language-flag">🇷🇺</span><span id="language-code">RU</span></button>
</header>
<main>
<section class="screen active" id="splash"><div class="splash-wrap"><img class="logo" src="/logo.svg?v=2" alt="JARVIS" style="width:350px!important;height:350px!important;max-width:350px!important;max-height:350px!important;object-fit:contain"><h1 data-i18n="start_title">Путешествуй по Беларуси</h1><p data-i18n="start_subtitle">Достопримечательности, маршруты и погода</p><button class="btn-main" id="start-travel" type="button" data-action="start" data-i18n="start">Начать путешествие</button></div></section>
<section class="screen" id="regions"><div class="topbar"><h2 data-i18n="region">Выберите регион</h2><span class="step">1/4</span></div><input id="region-search" class="search" type="search" data-i18n-placeholder="region_search" placeholder="Поиск региона..."><div class="grid" id="regions-grid"></div></section>
<section class="screen" id="cities"><button class="back" type="button" data-action="back" data-screen="regions">← <span data-i18n="back">Назад</span></button><div class="topbar"><h2 id="region-title">Область</h2><span class="step">2/4</span></div><input id="city-search" class="search" type="search" data-i18n-placeholder="city_search" placeholder="Поиск города..."><div class="grid" id="cities-grid"></div></section>
<section class="screen" id="weather"><div class="topbar"><h2 data-i18n="weather">Погода</h2></div><div id="weather-empty" class="weather-empty"><div class="weather-empty-icon">☀️</div><h3 data-i18n="weather_title">Погода по городу</h3><p data-i18n="weather_empty">Сначала выберите город в разделе «Путешествия»</p><button class="btn-main" type="button" data-action="choose-city" data-i18n="choose_city">Выбрать город</button></div><div id="weather-box" style="display:none"></div></section>
<section class="screen" id="tags"><button class="back" type="button" data-action="back" data-screen="cities">← <span data-i18n="back">Назад</span></button><div class="topbar"><h2 data-i18n="interests">Интересы</h2><span class="step">3/4</span></div><p class="hint" data-i18n="interests_hint">Можно выбрать несколько категорий</p><div class="tags" id="tags-list"></div><button class="btn-main" id="btn-tags" type="button" data-action="show-places" disabled data-i18n="show_places">Показать места</button></section>
<section class="screen" id="cards"><button class="back" type="button" data-action="back" data-screen="tags">← <span data-i18n="back">Назад</span></button><div class="topbar"><h2 id="cards-title" data-i18n="places">Места</h2></div><div class="feed" id="feed"></div><div id="poi-pagination" class="poi-pagination"></div></section>
<section class="screen" id="route"><button class="back" type="button" data-action="back" data-screen="cards">← <span data-i18n="back">Назад</span></button><div class="topbar"><h2 data-i18n="route">Мой маршрут</h2></div><div id="route-list"></div><button class="btn-route" id="btn-build" type="button" data-action="build-route" disabled data-i18n="build_route">Построить маршрут</button></section>
<section class="screen" id="groups"><div class="topbar"><h2>Группы</h2></div><button class="btn-main" type="button" data-action="group-create">+ Создать группу</button><div id="groups-list" class="grid"></div></section>
<section class="screen" id="group"><button class="back" type="button" data-action="back" data-screen="groups">← Назад</button><div class="topbar"><h2 id="group-title">Группа</h2></div><label>Дата начала поездки<input id="group-date" type="date" disabled></label><div id="group-members" class="group-members"></div><div class="group-actions"><button type="button" class="btn-main" data-action="group-invite">Пригласить @username</button><button type="button" class="btn-route" data-action="group-toggle-voting">Голосование</button></div><h3>Предложения маршрута</h3><div id="group-proposals"></div><h3>Чат</h3><div id="group-chat" class="group-chat"></div><div class="group-chat-input"><input id="group-message" type="text" maxlength="2000" placeholder="Сообщение..."><button type="button" data-action="group-send">Отправить</button></div></section>
</main>
<button class="fab hidden" id="fab" type="button">🗺 <span data-i18n="route_add">Маршрут</span> <span id="fab-count">0</span></button>
<nav class="bottom-nav" id="bottom-nav"><button class="bottom-nav-item active" type="button" data-tab="travel"><span>🧭</span><span data-i18n="travel">Путешествия</span></button><button class="bottom-nav-item" type="button" data-tab="weather"><span>☀️</span><span data-i18n="weather">Погода</span></button><button class="bottom-nav-item" type="button" data-action="groups"><span>👥</span><span>Группы</span></button></nav>
<div class="toast" id="toast"></div>
<script type="module" src="/js/main.js?v=20260912-1"></script>
</body>
</html>
