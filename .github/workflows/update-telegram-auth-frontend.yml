name: Telegram auth frontend migration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "      ...(options.body ? { 'Content-Type': 'application/json' } : {}),\n      ...(options.headers || {})",
              "      ...(options.body ? { 'Content-Type': 'application/json' } : {}),\n      ...(tg?.initData ? { 'Authorization': `tma ${tg.initData}` } : {}),\n      ...(options.headers || {})",
              1,
          )

          if 'async function authenticateTelegram()' not in s:
              marker = 'async function toggleFav(id) {'
              auth = '''async function authenticateTelegram() {\n  if (!tg?.initData) {\n    toast('Откройте приложение через Telegram');\n    return false;\n  }\n\n  try {\n    await apiFetch('/auth/telegram', { method: 'POST' });\n    return true;\n  } catch (error) {\n    console.error('Telegram auth error:', error);\n    toast('Не удалось подтвердить Telegram');\n    return false;\n  }\n}\n\n'''
              if marker not in s:
                  raise SystemExit('toggleFav marker not found')
              s = s.replace(marker, auth + marker, 1)

          old = """async function toggleFav(id) {
  const userId = getTelegramUserId();
  if (!userId) {
    toast('Откройте приложение через Telegram для избранного');
    return;
  }

  try {
    const data = await apiFetch('/favorites/toggle', {
      method: 'POST',
      body: JSON.stringify({ user_id: userId, poi_id: String(id) })
    });
"""
          new = """async function toggleFav(id) {
  try {
    const data = await apiFetch('/favorites/toggle', {
      method: 'POST',
      body: JSON.stringify({ poi_id: String(id) })
    });
"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """async function loadFavorites() {
  const userId = getTelegramUserId();
  if (!userId) return;

  try {
    const data = await apiFetch(`/favorites/${userId}`);
"""
          new = """async function loadFavorites() {
  try {
    const data = await apiFetch('/favorites/me');
"""
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace(
              "  await Promise.all([loadRegions(), loadFavorites()]);",
              "  const authenticated = await authenticateTelegram();\n  if (!authenticated) return;\n\n  await Promise.all([loadRegions(), loadFavorites()]);",
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: node --check frontend/app.js

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app.js
          git diff --cached --quiet || git commit -m 'feat(frontend): send Telegram initData'
          git push
