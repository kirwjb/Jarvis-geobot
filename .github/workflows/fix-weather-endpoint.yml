name: Fix weather endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[weather-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch weather endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routers/api_integrated.py')
          text = path.read_text(encoding='utf-8')

          old = '''@app.get("/api/weather/{city}", response_model=WeatherResponse)\nasync def get_weather_endpoint(city: str):\n    cached = await check_weather_cache(city)\n    if cached:\n        return WeatherResponse(\n            city=city,\n            description=cached.get("description", ""),\n            cached=True,\n        )\n    try:\n        weather_text = await get_weather(city)\n        await set_weather_cache(city, {"description": weather_text})\n        return WeatherResponse(\n            city=city,\n            description=weather_text,\n            cached=False,\n        )\n    except Exception as exc:\n        error(f"Weather API error for {city}: {exc}")\n        raise HTTPException(\n            status_code=500,\n            detail=get_text("internal_error"),\n        )\n'''

          new = '''@app.get("/api/weather/{city}", response_model=WeatherResponse)\nasync def get_weather_endpoint(city: str):\n    cached = await check_weather_cache(city)\n    if cached:\n        return WeatherResponse(\n            city=city,\n            temp=cached.get("temp"),\n            description=cached.get("description", ""),\n            humidity=cached.get("humidity"),\n            wind_speed=cached.get("wind_speed"),\n            pressure=cached.get("pressure"),\n            cached=True,\n        )\n    try:\n        weather_payload = await get_weather(city)\n        weather = json.loads(weather_payload)\n\n        if not isinstance(weather, dict):\n            raise ValueError("Weather provider returned invalid payload")\n\n        await set_weather_cache(city, weather)\n        return WeatherResponse(\n            city=city,\n            temp=weather.get("temp"),\n            description=weather.get("description", ""),\n            humidity=weather.get("humidity"),\n            wind_speed=weather.get("wind_speed"),\n            pressure=weather.get("pressure"),\n            cached=False,\n        )\n    except Exception as exc:\n        error(f"Weather API error for {city}: {exc}")\n        raise HTTPException(\n            status_code=500,\n            detail=get_text("internal_error"),\n        )\n'''

          if old not in text:
              raise SystemExit('Expected weather endpoint block was not found; refusing to modify the file.')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routers/api_integrated.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(weather): pass structured weather fields [weather-fix]"
          git push
