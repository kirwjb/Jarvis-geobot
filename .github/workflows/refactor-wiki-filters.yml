name: Refactor Wikimedia filters

on:
  push:
    branches: [main]

jobs:
  refactor:
    if: github.event.head_commit.message != 'refactor(wiki): move pure filters to utils'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move pure Wikimedia filters to utils
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("src/services/wiki_service.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          remove_names = {"BELARUS_BBOX", "BAD_EXTENSIONS", "BAD_DESCRIPTION_WORDS", "CITY_SYNONYMS", "TYPE_QUERY_WORDS", "TRANSLIT_TABLE", "STOP_WORDS", "_normalize_text", "_translit", "_text_forms", "is_in_belarus", "_distance_score", "_is_valid_photo", "_match_score", "_city_variants"}
          spans = []
          for node in tree.body:
              name = getattr(node, "name", None)
              if name in remove_names:
                  spans.append((node.lineno, node.end_lineno))
              elif isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  if any(isinstance(t, ast.Name) and t.id in remove_names for t in targets):
                      spans.append((node.lineno, node.end_lineno))
          remove_lines = set()
          for start, end in spans:
              remove_lines.update(range(start, end + 1))
          lines = source.splitlines(keepends=True)
          new_source = "".join(line for i, line in enumerate(lines, 1) if i not in remove_lines)
          import_line = '''from src.utils.wiki_filters import (\n    TYPE_QUERY_WORDS,\n    city_variants,\n    distance_score,\n    is_in_belarus,\n    is_valid_photo,\n    match_score,\n    normalize_text,\n    text_forms,\n    translit,\n)\n'''
          marker = "from src.utils.utils import log, error\n"
          if "from src.utils.wiki_filters import" not in new_source:
              new_source = new_source.replace(marker, marker + import_line, 1)
          for old, new in {"_normalize_text":"normalize_text", "_translit":"translit", "_text_forms":"text_forms", "_distance_score":"distance_score", "_is_valid_photo":"is_valid_photo", "_match_score":"match_score", "_city_variants":"city_variants"}.items():
              new_source = new_source.replace(old, new)
          ast.parse(new_source)
          path.write_text(new_source, encoding="utf-8")
          PY
      - name: Validate
        run: python -m py_compile src/utils/wiki_filters.py src/services/wiki_service.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/wiki_service.py src/utils/wiki_filters.py
          git commit -m "refactor(wiki): move pure filters to utils" || exit 0
          git push
